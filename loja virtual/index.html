<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loja Maré – Atividade de IHC</title>
<style>
/* ========= TEMA: loja de praia (azul-mar, areia, coral) ========= */
:root{
  --mar:#0b4f6c; --mar-claro:#dff1f5; --areia:#fbf6ea; --coral:#e4572e;
  --ok:#1b7f4b; --erro:#b3261e; --texto:#16313d;
  --dur:.4s;               /* DURAÇÃO das animações (alterada pelo seletor de velocidade) */
}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--areia);color:var(--texto);line-height:1.5}
header{background:var(--mar);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:1.4rem;letter-spacing:.02em}
.opcoes{display:flex;flex-wrap:wrap;gap:12px;font:.9rem system-ui,sans-serif}
.opcoes label{display:flex;align-items:center;gap:6px}
select{font:inherit;padding:2px 4px}
main{max-width:980px;margin:0 auto;padding:20px;display:grid;gap:24px;grid-template-columns:1fr;font-family:system-ui,sans-serif}
@media(min-width:760px){main{grid-template-columns:1.4fr 1fr}}
h2{font-family:Georgia,serif;margin:0 0 12px;color:var(--mar)}
.produtos{display:grid;gap:12px}
.produto{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--mar-claro);border-radius:10px;padding:12px}
.produto .ico{font-size:2rem}
.produto .info{flex:1}
.produto b{display:block}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--mar);color:#fff;font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
button:disabled{opacity:.7;cursor:wait}

/* ===== ANIMAÇÃO 1 – AÇÃO REALIZADA =====
   HTML: <button class="btn-add"> em cada produto
   JS:   evento "click" -> adicionar() -> classes .feito e .pulo
   CSS:  :active (afunda o botão), @keyframes pulo (carrinho), .feito (muda cor + texto) */
.btn-add{transition:transform var(--dur) ease, background var(--dur) ease}
.btn-add:active{transform:scale(.92)}
.btn-add.feito{background:var(--ok)}
.carrinho-titulo{display:flex;align-items:center;gap:10px}
.selo{background:var(--coral);color:#fff;border-radius:999px;min-width:28px;text-align:center;padding:2px 8px;font-weight:700}
.selo.pulo{animation:pulo var(--dur) ease}
@keyframes pulo{0%{transform:scale(1)}50%{transform:scale(1.5)}100%{transform:scale(1)}}

.carrinho{background:#fff;border-radius:10px;padding:16px;border:2px solid var(--mar-claro);align-self:start}
.carrinho ul{list-style:none;padding:0;margin:0 0 12px;min-height:48px}
.carrinho li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--mar-claro)}
.carrinho li.novo{animation:entra var(--dur) ease}
@keyframes entra{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.vazio{color:#5b727c}
.total{display:flex;justify-content:space-between;font-weight:700;margin-bottom:12px}
.btn-finalizar{width:100%;background:var(--coral);display:flex;justify-content:center;align-items:center;gap:10px}

/* ===== ANIMAÇÃO 2 – OPERAÇÃO EM ANDAMENTO =====
   HTML: <span class="spinner"> dentro do botão "Finalizar compra"
   JS:   evento "click" -> finalizar() mostra o spinner e desativa o botão por 2 s
   CSS:  @keyframes gira (rotação contínua) */
.spinner{display:none;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%}
.carregando .spinner{display:inline-block;animation:gira calc(var(--dur) * 2) linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* ===== ANIMAÇÃO 3 – RESULTADO (sucesso ou erro) =====
   HTML: <div id="resultado"> com ícone (✔ ou ✖) + mensagem
   JS:   fim do setTimeout em finalizar() -> classe .sucesso ou .erro
   CSS:  @keyframes desenha (traço do ✔) e tremer (caixa de erro) */
#resultado{display:none;margin-top:14px;padding:12px;border-radius:8px;font-weight:600;align-items:center;gap:10px}
#resultado.sucesso{display:flex;background:#e3f4ea;color:var(--ok);border:2px solid var(--ok)}
#resultado.erro{display:flex;background:#fbe7e5;color:var(--erro);border:2px solid var(--erro);animation:tremer calc(var(--dur) * 1.5) ease}
#resultado svg{width:28px;height:28px;flex:none}
#resultado .traco{stroke-dasharray:30;stroke-dashoffset:30;animation:desenha calc(var(--dur) * 2) ease forwards}
@keyframes desenha{to{stroke-dashoffset:0}}
@keyframes tremer{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ===== REDUZIR MOVIMENTOS =====
   Ativado pela caixa de seleção OU pela configuração do sistema (prefers-reduced-motion).
   Remove os movimentos; as informações continuam em texto e ícones. */
body.reduzir *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
body.reduzir .traco{stroke-dashoffset:0}
</style>
</head>
<body>
<header>
  <h1>🌊 Loja Maré</h1>
  <div class="opcoes">
    <label><input type="checkbox" id="reduzir"> Reduzir movimentos</label>
    <label>Velocidade
      <select id="velocidade">
        <option value=".2s">Rápida (0,2 s)</option>
        <option value=".4s" selected>Normal (0,4 s)</option>
        <option value=".9s">Lenta (0,9 s)</option>
      </select>
    </label>
    <label><input type="checkbox" id="simularErro"> Simular erro no pagamento</label>
  </div>
</header>

<main>
  <section aria-labelledby="t-prod">
    <h2 id="t-prod">Produtos</h2>
    <div class="produtos" id="produtos"></div>
  </section>

  <aside class="carrinho" aria-labelledby="t-carr">
    <div class="carrinho-titulo"><h2 id="t-carr" style="margin:0">Carrinho</h2><span class="selo" id="selo" aria-label="Itens no carrinho">0</span></div>
    <ul id="lista" style="margin-top:12px"><li class="vazio">Seu carrinho está vazio. Adicione um produto.</li></ul>
    <div class="total"><span>Total</span><span id="total">R$ 0,00</span></div>
    <button class="btn-finalizar" id="finalizar"><span class="spinner" aria-hidden="true"></span><span id="rotulo">Finalizar compra</span></button>
    <!-- aria-live: leitores de tela anunciam cada mudança de estado -->
    <div id="resultado" role="status" aria-live="polite"></div>
  </aside>
</main>

<script>
const PRODUTOS=[
  {id:1,nome:"Chapéu de palha",ico:"👒",preco:59.9},
  {id:2,nome:"Protetor solar FPS 50",ico:"🧴",preco:42.5},
  {id:3,nome:"Canga estampada",ico:"🏖️",preco:35.0},
  {id:4,nome:"Óculos de sol",ico:"🕶️",preco:89.0}
];
let carrinho=[];
const $=id=>document.getElementById(id);
const moeda=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

// Monta a vitrine
PRODUTOS.forEach(p=>{
  const d=document.createElement("div");d.className="produto";
  d.innerHTML=`<span class="ico" aria-hidden="true">${p.ico}</span>
    <div class="info"><b>${p.nome}</b>${moeda(p.preco)}</div>
    <button class="btn-add" data-id="${p.id}">Adicionar</button>`;
  $("produtos").appendChild(d);
});

// ANIMAÇÃO 1 – evento click no botão "Adicionar"
$("produtos").addEventListener("click",e=>{
  const btn=e.target.closest(".btn-add"); if(!btn) return;
  adicionar(+btn.dataset.id,btn);
});

function reiniciar(el,classe){el.classList.remove(classe);void el.offsetWidth;el.classList.add(classe)}

function adicionar(id,btn){
  const p=PRODUTOS.find(x=>x.id===id); carrinho.push(p);
  // Feedback textual + visual no botão (funciona sem animação)
  btn.classList.add("feito"); btn.textContent="✔ Adicionado";
  setTimeout(()=>{btn.classList.remove("feito");btn.textContent="Adicionar"},1200);
  desenhar(true);
  reiniciar($("selo"),"pulo");
  $("resultado").className=""; $("resultado").textContent="";
}

function desenhar(novo){
  const ul=$("lista"); ul.innerHTML="";
  if(!carrinho.length){ul.innerHTML='<li class="vazio">Seu carrinho está vazio. Adicione um produto.</li>'}
  carrinho.forEach((p,i)=>{
    const li=document.createElement("li");
    li.innerHTML=`<span>${p.ico} ${p.nome}</span><span>${moeda(p.preco)}</span>`;
    if(novo && i===carrinho.length-1) li.className="novo";
    ul.appendChild(li);
  });
  $("selo").textContent=carrinho.length;
  $("total").textContent=moeda(carrinho.reduce((s,p)=>s+p.preco,0));
}

// ANIMAÇÕES 2 e 3 – evento click em "Finalizar compra"
$("finalizar").addEventListener("click",()=>{
  const res=$("resultado"); res.className=""; res.textContent="";
  if(!carrinho.length){
    res.className="erro";
    res.innerHTML=icone(false)+"<span>Seu carrinho está vazio. Adicione um produto antes de finalizar.</span>";
    return;
  }
  const btn=$("finalizar");
  btn.disabled=true; btn.classList.add("carregando");   // animação 2: spinner
  $("rotulo").textContent="Processando pagamento…";      // texto: não depende da animação
  setTimeout(()=>{
    btn.disabled=false; btn.classList.remove("carregando");
    $("rotulo").textContent="Finalizar compra";
    if($("simularErro").checked){                        // animação 3: erro (tremer)
      res.className="erro";
      res.innerHTML=icone(false)+"<span>Pagamento recusado. Confira os dados do cartão e tente de novo.</span>";
    }else{                                               // animação 3: sucesso (✔ desenhado)
      res.className="sucesso";
      res.innerHTML=icone(true)+"<span>Compra confirmada! Você receberá o recibo por e-mail.</span>";
      carrinho=[]; desenhar(false);
    }
  },2000);
});

function icone(ok){
  return ok
   ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path class="traco" d="M7 12.5l3.5 3.5L17 9"/></svg>'
   :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 8l8 8M16 8l-8 8"/></svg>';
}

// Opções de acessibilidade e velocidade
$("velocidade").addEventListener("change",e=>document.documentElement.style.setProperty("--dur",e.target.value));
$("reduzir").addEventListener("change",e=>document.body.classList.toggle("reduzir",e.target.checked));
if(matchMedia("(prefers-reduced-motion: reduce)").matches){$("reduzir").checked=true;document.body.classList.add("reduzir")}
</script>
</body>
</html>
